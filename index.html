<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple personal expense tracker.">
  <title>My Expenses</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>My Expenses</h1>

    <section aria-labelledby="add-expense-heading">
      <h2 id="add-expense-heading">Add an expense</h2>
      <form id="expense-form">
        <label for="item-name">What did you buy?</label>
        <input type="text" id="item-name" name="description" placeholder="Name of item" maxlength="200" required>

        <label for="item-cost">How much did it cost?</label>
        <input type="number" id="item-cost" name="amount" placeholder="0.00" min="0.01" step="0.01" inputmode="decimal" required>

        <button type="submit">Add expense</button>
        <p id="form-message" class="message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section aria-labelledby="total-expenses">
      <h2 id="total-expenses">Total Expenses: $0.00</h2>
      <div id="expenses" aria-live="polite"></div>
      <p id="empty-state" class="empty-state">No expenses yet. Add your first expense above.</p>
    </section>
    <p class="storage-note">Your expenses are saved in this browser on this device.</p>
  </main>
</body>
</html>
